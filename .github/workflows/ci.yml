name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Unit tests in Asia/Manila timezone
        run: npm test
        env:
          TZ: Asia/Manila

  database:
    name: Migrations, pgTAP, integration & security, E2E
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start local Supabase (applies migrations + seed)
        run: npm run db:start
      - name: Export Supabase env for the app and tests
        run: |
          npx supabase status -o env \
            | sed -n -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' \
                     -e 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p' \
                     -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' \
            | tr -d '"' > apps/web/.env.local
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3100" >> apps/web/.env.local
          echo "JOB_RUNNER_SECRET=ci-job-runner-secret-0123456789abcdef0123" >> apps/web/.env.local
          echo "APP_ENV=test" >> apps/web/.env.local
      - run: npm run db:lint
      - run: npm run test:db
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
