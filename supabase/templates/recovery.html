<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #f6f3eb; font-family: Inter, Arial, sans-serif; color: #1c2b27">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding: 32px 16px">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            style="max-width: 480px; background: #ffffff; border-radius: 16px; padding: 32px"
          >
            <tr>
              <td>
                <p style="margin: 0 0 24px; font-size: 20px; font-weight: 800; color: #153d35">
                  Bahay<span style="color: #c57a59">+</span>
                </p>
                <h1 style="margin: 0 0 12px; font-size: 22px; color: #153d35">Reset your password</h1>
                <p style="margin: 0 0 24px; line-height: 1.5">
                  We received a request to reset your Bahay+ password. This link expires in one hour.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
                    style="
                      display: inline-block;
                      background: #153d35;
                      color: #ffffff;
                      text-decoration: none;
                      font-weight: 600;
                      padding: 12px 20px;
                      border-radius: 10px;
                    "
                    >Choose a new password</a
                  >
                </p>
                <p style="margin: 0; font-size: 13px; color: #56625d">
                  If you didn't request this, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
